name: Pilot TeamBuilder
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - if: runner.os == 'macOS'
        run: python scripts/build_face_helper.py
      - run: python -m unittest discover -s tests -v
      - name: Install desktop test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
      - name: Exercise desktop review under Xvfb
        if: runner.os == 'Linux'
        env:
          TEAMBUILDER_GUI_TEST: '1'
          TEAMBUILDER_UI_CAPTURE: desktop-review.png
        run: xvfb-run -a -s '-screen 0 1600x1100x24' python -m unittest discover -s tests -p test_desktop_smoke.py -v
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: synthetic-desktop-preview
          path: desktop-review.png
          if-no-files-found: ignore
      - name: Build Apple Silicon desktop preview
        if: runner.os == 'macOS'
        run: |
          python -m pip install PyInstaller==6.22.3
          python scripts/build_macos_preview.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Pilot-TeamBuilder-macOS-arm64-preview
          path: dist/Pilot-TeamBuilder-*-macOS-arm64-preview.zip
          if-no-files-found: error
